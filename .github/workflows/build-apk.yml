name: Build APK from PWA

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "معرف داخلي للبناء (بيتولد تلقائيًا لو استدعيت الـ workflow من الموقع)"
        required: false
        type: string
      pwa_url:
        description: "رابط الموقع (PWA) - لازم يكون فيه manifest.json بنفس النطاق"
        required: true
        type: string
      app_name:
        description: "اسم التطبيق (اختياري - افتراضيًا من manifest.json الموقع)"
        required: false
        type: string
      package_id:
        description: "معرف الحزمة، مثال: app.dev.mysite (اختياري - بيتولد تلقائيًا من النطاق)"
        required: false
        type: string
      display_mode:
        description: "وضع العرض"
        required: false
        type: choice
        options:
          - fullscreen
          - standalone
        default: fullscreen
      theme_color:
        description: "لون الثيم (اختياري، مثال #121212)"
        required: false
        type: string
      background_color:
        description: "لون الخلفية (اختياري، مثال #121212)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap JDK/Android SDK paths (non-interactive)
        run: |
          ANDROID_SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          printf 'n\n%s\nn\n%s\nn\n%s\nn\n%s\n' \
            "$JAVA_HOME" "$ANDROID_SDK_PATH" "$JAVA_HOME" "$ANDROID_SDK_PATH" | \
            bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_SDK_PATH"

      - name: Generate signing key (fresh per build)
        run: |
          mkdir -p build
          KEYSTORE_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 24)
          KEY_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 24)
          keytool -genkeypair -v \
            -keystore build/android.keystore \
            -alias androidkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=APKFactory, OU=APKFactory, O=APKFactory, L=NA, S=NA, C=IQ"
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Generate twa-manifest.json from the PWA
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_ID: ${{ github.event.inputs.package_id }}
          DISPLAY_MODE: ${{ github.event.inputs.display_mode }}
          THEME_COLOR: ${{ github.event.inputs.theme_color }}
          BACKGROUND_COLOR: ${{ github.event.inputs.background_color }}
        run: node scripts/generate-manifest.js

      - name: Generate Android project from twa-manifest.json
        working-directory: build
        run: yes n | bubblewrap update --manifest=./twa-manifest.json

      - name: Build signed APK
        working-directory: build
        run: yes n | bubblewrap build --skipPwaValidation

      - name: Rename APK
        id: rename
        working-directory: build
        run: |
          RAW_NAME=$(node -e "console.log(require('./twa-manifest.json').name)")
          SAFE_NAME=$(echo "$RAW_NAME" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(s.trim().replace(/[^a-zA-Z0-9\u0600-\u06FF]+/g,'-')))")
          mv app-release-signed.apk "${SAFE_NAME}.apk"
          echo "apk_path=build/${SAFE_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "apk_name=${SAFE_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: ${{ steps.rename.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.build_id != '' && github.event.inputs.build_id || format('build-{0}', github.run_number) }}
          name: ${{ steps.rename.outputs.apk_name }}
          files: ${{ steps.rename.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
